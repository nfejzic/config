[metadata]
name = "rose-pine-moon-custom"
author = "Nadir Fejzić"

[colors]
foreground = "#e0def4"
background = "#232136"

cursor_bg = "#e0def4"
cursor_border = "#e0def4"
cursor_fg = "#232136"

compose_cursor = "#9ccfd8"

selection_bg = "#393552"
selection_fg = "#e0def4"

scrollbar_thumb = "#393552" # same as tab bar
split = "#393552"           # same as tab bar
visual_bell = "#eb6f92"     # ansi 2

ansi = [
    "#393552",
    "#eb6f92",
    "#3e8fb0",
    "#f6c177",
    "#9ccfd8",
    "#c4a7e7",
    "#ea9a97",
    "#e0def4",
]
brights = [
    "#6e6a86",
    "#eb6f92",
    "#3e8fb0",
    "#f6c177",
    "#9ccfd8",
    "#c4a7e7",
    "#ea9a97",
    "#e0def4",
]

[colors.tab_bar]
background = "#393552"
inactive_tab_edge = "#393552"
inactive_tab_edge_hover = "#393552"

[colors.tab_bar.active_tab]
bg_color = "#393552"
fg_color = "#e0def4"  # foreground
intensity = "Bold"
italic = false
strikethrough = false
underline = "None"

[colors.tab_bar.inactive_tab]
bg_color = "#393552"
fg_color = "#6e6a86"  # muted
intensity = "Normal"
italic = false
strikethrough = false
underline = "None"

[colors.tab_bar.inactive_tab_hover]
bg_color = "#393552"
fg_color = "#9ccfd8"  # ansi 5
intensity = "Normal"
italic = false
strikethrough = false
underline = "None"

[colors.tab_bar.new_tab]
bg_color = "#393552"
fg_color = "#e0def4"  # ansi 8 / foreground
intensity = "Normal"
italic = false
strikethrough = false
underline = "None"

[colors.tab_bar.new_tab_hover]
bg_color = "#393552"
fg_color = "#9ccfd8"  # ansi 5
intensity = "Normal"
italic = false
strikethrough = false
underline = "None"
